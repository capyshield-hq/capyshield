# Re-publish the npm packages for an existing GitHub Release, e.g. after a partial failure
# in release.yml. Versions already on npm are skipped. Run from the Actions tab or:
#   gh workflow run publish-npm.yml -f tag=v0.1.0
name: publish-npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.0)
        required: true
permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Download release binaries
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'capyshield-*-*.tar.gz' --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
      - run: node npm/publish.mjs "${TAG#v}" dist --publish
        env:
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
