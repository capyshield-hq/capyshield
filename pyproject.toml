# Ships the native `capyshield` binary as a Python wheel (no Python code at runtime),
# so it installs with `uv tool install capyshield`, `uvx capyshield`, `pipx` or `pip`.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "capyshield"
description = "Deterministic zero-trust egress guard and local VEX/reachability engine"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Agus Makmun", email = "summon.agus@gmail.com" }]
requires-python = ">=3.8"
keywords = ["security", "egress", "openvex", "supply-chain", "sbom", "ai-agents", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://capyshield.com"
Repository = "https://github.com/capyshield-hq/capyshield"
Issues = "https://github.com/capyshield-hq/capyshield/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/capyshield-cli/Cargo.toml"
strip = true
